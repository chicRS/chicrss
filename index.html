<script>

const SHIPPING = 680;

let products = [];

let cart = JSON.parse(
  localStorage.getItem("chicCart") || "[]"
);

let filter = "all";
let editId = null;
let editorImages = [];
let pendingFiles = [];
let detailProduct = null;
let detailIndex = 0;
let selectedSize = "";

const $ = id => document.getElementById(id);

const money = n =>
  new Intl.NumberFormat("sr-RS").format(Number(n) || 0) + " RSD";

const esc = v =>
  String(v ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

function getImages(p) {

  if (
    Array.isArray(p?.images) &&
    p.images.length
  ) {
    return p.images;
  }

  return p?.image
    ? [p.image]
    : [];
}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

  try {

    const r = await fetch(
      "/api/products",
      {
        cache: "no-store"
      }
    );

    if (!r.ok) {
      throw new Error(
        "Products API error: HTTP " + r.status
      );
    }

    const data = await r.json();

    products =
      Array.isArray(data)
        ? data
        : [];

  } catch (error) {

    console.error(
      "Greška pri učitavanju proizvoda:",
      error
    );

    products = [];

  }

  renderProducts();
  renderAdmin();
  renderCart();
}


/* =========================
   SHOP
========================= */

function renderProducts() {

  const q =
    ($("search").value || "").toLowerCase();

  const b =
    ($("brandFilter").value || "").toLowerCase();

  const s =
    ($("sizeFilter").value || "").trim();

  const mi =
    Number($("minPrice").value) || 0;

  const ma =
    Number($("maxPrice").value) || Infinity;

  const a =
    $("availability").value;

  let list =
    products.filter(p =>

      (
        filter === "all" ||
        p.category === filter
      )

      &&

      (
        !q ||
        String(p.name || "")
          .toLowerCase()
          .includes(q) ||

        String(p.brand || "")
          .toLowerCase()
          .includes(q)
      )

      &&

      (
        !b ||
        String(p.brand || "")
          .toLowerCase()
          .includes(b)
      )

      &&

      (
        !s ||
        (p.sizes || [])
          .map(String)
          .includes(s)
      )

      &&

      Number(p.price) >= mi &&
      Number(p.price) <= ma

      &&

      (
        a === "all" ||

        (
          a === "available" &&
          Number(p.stock) > 0
        ) ||

        (
          a === "sold" &&
          Number(p.stock) <= 0
        )
      )
    );


  if ($("sort").value === "new") {

    list.sort(
      (x,y) =>
        Number(y.id) -
        Number(x.id)
    );

  }


  if ($("sort").value === "low") {

    list.sort(
      (x,y) =>
        Number(x.price) -
        Number(y.price)
    );

  }


  if ($("sort").value === "high") {

    list.sort(
      (x,y) =>
        Number(y.price) -
        Number(x.price)
    );

  }


  if ($("sort").value === "position") {

    list.sort(
      (x,y) =>
        (
          Number(x.sortOrder || 0) -
          Number(y.sortOrder || 0)
        )
        ||
        (
          Number(x.id) -
          Number(y.id)
        )
    );

  }


  $("resultCount").textContent =
    list.length + " proizvoda";


  $("products").innerHTML =

    list.length

      ?

      list.map(p => {

        const ims =
          getImages(p);

        const sold =
          Number(p.stock) <= 0;

        return `

<article
  class="product"
  onclick="openProduct(${Number(p.id)})"
>

<div class="photo">

<img
  src="${esc(
    ims[0] ||
    "/chic-logo.svg"
  )}"
  alt="${esc(p.name)}"
>

${
  ims.length > 1
  ?
`

<button
  type="button"
  class="card-prev"
  onclick="
    event.stopPropagation();
    quickImage(${Number(p.id)},-1)
  "
>‹</button>

<button
  type="button"
  class="card-next"
  onclick="
    event.stopPropagation();
    quickImage(${Number(p.id)},1)
  "
>›</button>

<span
  class="card-count"
  id="cc-${Number(p.id)}"
>
1 / ${ims.length}
</span>

`
  :
  ""
}

${
  p.badge
  ?
`
<span class="badge">
${esc(p.badge)}
</span>
`
  :
  ""
}

<em class="${sold ? "out" : ""}">
${
  sold
    ? "RASPRODATO"
    : "DOSTUPNO · " +
      Number(p.stock) +
      " KOM."
}
</em>

</div>

<div class="meta">

<div>

<h3>
${esc(p.name)}
</h3>

<p>
${esc(p.brand || "")}
·
${p.category === "patike"
  ? "Patike"
  : "Garderoba"}
</p>

</div>

<b>
${money(p.price)}
</b>

</div>

<div class="sizes">

${
  (p.sizes || [])
    .map(x => `

<button
  type="button"
  onclick="
    event.stopPropagation();
    add(${Number(p.id)},'${esc(x)}')
  "
>
${esc(x)}
</button>

`)
    .join("")
}

</div>

</article>

`;

      }).join("")

      :

      `
<p class="muted">
Nema proizvoda za izabrane filtere.
</p>
`;
}


/* =========================
   QUICK IMAGE
========================= */

const quickIndexes = {};

function quickImage(id,d) {

  const p =
    products.find(
      x =>
        Number(x.id) ===
        Number(id)
    );

  if (!p) return;

  const ims =
    getImages(p);

  if (!ims.length) return;

  quickIndexes[id] =
    (
      (quickIndexes[id] ?? 0)
      + d
      + ims.length
    ) % ims.length;

  const card =
    document.querySelector(
      `.product[onclick="openProduct(${Number(id)})"]`
    );

  if (card) {

    const image =
      card.querySelector(
        ".photo img"
      );

    if (image) {
      image.src =
        ims[quickIndexes[id]];
    }

  }

  const counter =
    $("cc-" + id);

  if (counter) {

    counter.textContent =
      `${quickIndexes[id] + 1} / ${ims.length}`;

  }

}


/* =========================
   PRODUCT DETAIL
========================= */

function openProduct(id) {

  detailProduct =
    products.find(
      x =>
        Number(x.id) ===
        Number(id)
    );

  if (!detailProduct) return;

  detailIndex = 0;
  selectedSize = "";

  renderDetail();

  $("productModal")
    .classList.add("show");
}


function renderDetail() {

  const p =
    detailProduct;

  if (!p) return;

  const ims =
    getImages(p);

  $("detailImage").src =
    ims[detailIndex] ||
    "/chic-logo.svg";

  $("detailCounter").textContent =
    ims.length
      ? `${detailIndex + 1} / ${ims.length}`
      : "";

  $("detailBrand").textContent =
    p.brand ||
    "CHIC.RS";

  $("detailName").textContent =
    p.name ||
    "";

  $("detailDesc").textContent =
    p.description ||
    "Premium streetwear model.";

  $("detailPrice").textContent =
    money(p.price);

  $("detailStock").textContent =
    Number(p.stock) > 0
      ? `Dostupno: ${Number(p.stock)} kom.`
      : "Rasprodato";

  $("detailThumbs").innerHTML =
    ims.map(
      (x,n) => `

<button
  type="button"
  class="${n === detailIndex ? "selected" : ""}"
  onclick="
    detailIndex=${n};
    renderDetail()
  "
>
<img
  src="${esc(x)}"
  alt=""
>
</button>

`
    ).join("");


  $("detailSizes").innerHTML =
    (p.sizes || [])
      .map(
        s => `

<button
  type="button"
  class="${
    selectedSize === String(s)
      ? "sel"
      : ""
  }"
  onclick="
    selectedSize='${esc(s)}';
    renderDetail()
  "
>
${esc(s)}
</button>

`
      )
      .join("");


  $("detailAdd").disabled =
    Number(p.stock) <= 0;


  $("detailAdd").onclick =
    () => {

      add(
        p.id,
        selectedSize ||
        (p.sizes || [])[0] ||
        ""
      );

      closeProduct();

    };

}


function changeDetail(d) {

  const ims =
    getImages(detailProduct);

  if (!ims.length) return;

  detailIndex =
    (
      detailIndex +
      d +
      ims.length
    ) % ims.length;

  renderDetail();
}


function closeProduct() {

  $("productModal")
    .classList.remove("show");

}


/* =========================
   CART
========================= */

function add(id,size) {

  const p =
    products.find(
      x =>
        Number(x.id) ===
        Number(id)
    );

  if (
    !p ||
    Number(p.stock) <= 0
  ) {

    alert(
      "Proizvod trenutno nije dostupan."
    );

    return;
  }


  const chosenSize =
    String(size || "");


  const e =
    cart.find(
      x =>
        Number(x.id) ===
        Number(id) &&
        String(x.size) ===
        chosenSize
    );


  if (e) {

    if (
      Number(e.qty) >=
      Number(p.stock)
    ) {

      alert(
        "Nema više komada."
      );

      return;
    }

    e.qty++;

  } else {

    cart.push({
      id: Number(id),
      size: chosenSize,
      qty: 1
    });

  }


  localStorage.setItem(
    "chicCart",
    JSON.stringify(cart)
  );

  renderCart();
  openCart();

}


function renderCart() {

  $("cartCount").textContent =
    cart.reduce(
      (s,x) =>
        s +
        Number(x.qty || 0),
      0
    );


  $("cartItems").innerHTML =
    cart.map(
      (x,i) => {

        const p =
          products.find(
            p =>
              Number(p.id) ===
              Number(x.id)
          );

        if (!p) return "";


        return `

<div class="cartrow">

<img
  src="${esc(
    getImages(p)[0] ||
    "/chic-logo.svg"
  )}"
  alt=""
>

<div>

<b>
${esc(p.name)}
</b>

<small>
Veličina ${esc(x.size)}
· ${Number(x.qty)} kom.
</small>

</div>

<strong>
${money(
  Number(p.price) *
  Number(x.qty)
)}
</strong>

<button
  type="button"
  onclick="removeCart(${i})"
>
×
</button>

</div>

`;

      }
    ).join("")
    ||

    `
<p class="muted">
Korpa je prazna.
</p>
`;


  const sub =
    cart.reduce(
      (s,x) => {

        const p =
          products.find(
            p =>
              Number(p.id) ===
              Number(x.id)
          );

        return p
          ? s +
            Number(p.price) *
            Number(x.qty)
          : s;

      },
      0
    );


  $("sub").textContent =
    money(sub);

  $("total").textContent =
    money(
      sub + SHIPPING
    );

}


function removeCart(i) {

  cart.splice(i,1);

  localStorage.setItem(
    "chicCart",
    JSON.stringify(cart)
  );

  renderCart();

}


function openCart() {

  $("cartModal")
    .classList.add("show");

  renderCart();

}


function closeCart() {

  $("cartModal")
    .classList.remove("show");

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

  if (!cart.length) {

    alert(
      "Korpa je prazna."
    );

    return;
  }


  closeCart();


  const sub =
    cart.reduce(
      (s,x) => {

        const p =
          products.find(
            p =>
              Number(p.id) ===
              Number(x.id)
          );

        return p
          ? s +
            Number(p.price) *
            Number(x.qty)
          : s;

      },
      0
    );


  const total =
    sub + SHIPPING;


  $("preview").innerHTML =

    cart
      .map(x => {

        const p =
          products.find(
            p =>
              Number(p.id) ===
              Number(x.id)
          );

        if (!p) return "";

        return `

<div class="previewrow">

<span>
${esc(p.name)}
· veličina ${esc(x.size)}
× ${Number(x.qty)}
</span>

<b>
${money(
  Number(p.price) *
  Number(x.qty)
)}
</b>

</div>

`;

      })
      .join("")

    +

    `

<div class="previewrow">

<span>
DOSTAVA
</span>

<b>
${money(SHIPPING)}
</b>

</div>

<div class="previewrow totalrow">

<span>
UKUPNO
</span>

<b>
${money(total)}
</b>

</div>

`;


  $("order").value =
    cart
      .map(x => {

        const p =
          products.find(
            p =>
              Number(p.id) ===
              Number(x.id)
          );

        if (!p) return "";

        return (
          `${p.name} | ` +
          `veličina ${x.size} | ` +
          `količina ${Number(x.qty)} | ` +
          `${money(
            Number(p.price) *
            Number(x.qty)
          )}`
        );

      })
      .filter(Boolean)
      .join(" || ");


  $("amount").value =
    money(total);


  $("checkoutModal")
    .classList.add("show");

}


function closeCheckout() {

  $("checkoutModal")
    .classList.remove("show");

}


/* =========================
   NETLIFY FORM
========================= */

const orderForm =
  $("orderForm");


if (orderForm) {

  orderForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (!orderForm.reportValidity()) {
        return;
      }


      const button =
        $("submitOrder");


      if (button) {

        button.disabled = true;

        button.textContent =
          "SLANJE PORUDŽBINE...";

      }


      try {

        const formData =
          new FormData(orderForm);


        const body =
          new URLSearchParams();


        body.append(
          "form-name",
          "chic-orders"
        );


        for (
          const [key,value]
          of formData.entries()
        ) {

          body.append(
            key,
            String(value)
          );

        }


        const response =
          await fetch(
            "/",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/x-www-form-urlencoded"
              },

              body:
                body.toString()
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        alert(
          "Porudžbina je uspešno poslata! Hvala na kupovini."
        );


        cart = [];

        localStorage.removeItem(
          "chicCart"
        );

        renderCart();

        orderForm.reset();

        closeCheckout();


      } catch (error) {

        console.error(
          "ORDER ERROR:",
          error
        );

        alert(
          "Greška pri slanju porudžbine: " +
          (error?.message ||
           "Pokušaj ponovo.")
        );

      } finally {

        if (button) {

          button.disabled = false;

          button.textContent =
            "POŠALJI PORUDŽBINU →";

        }

      }

    }
  );

}


/* =========================
   FILTERS
========================= */

function resetFilters() {

  $("search").value = "";
  $("brandFilter").value = "";
  $("sizeFilter").value = "";
  $("minPrice").value = "";
  $("maxPrice").value = "";

  $("availability").value =
    "all";

  $("sort").value =
    "position";

  filter = "all";


  document
    .querySelectorAll(
      ".tabs button"
    )
    .forEach(
      b =>
        b.classList.toggle(
          "active",
          b.dataset.filter ===
          "all"
        )
    );


  renderProducts();

}


/* =========================
   ADMIN LOGIN
========================= */

function openAdmin() {

  $("loginError").textContent =
    "";

  $("adminPassword").value =
    "";

  $("loginModal")
    .classList.add("show");


  setTimeout(
    () =>
      $("adminPassword").focus(),
    50
  );

}


function closeLogin() {

  $("loginModal")
    .classList.remove("show");

}


function closeAdminPanel() {

  $("adminModal")
    .classList.remove("show");

}


async function loginAdmin() {

  try {

    const password =
      $("adminPassword").value;


    const r =
      await fetch(
        "/api/admin/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              password
            })
        }
      );


    if (!r.ok) {

      $("loginError")
        .textContent =
          "Pogrešna lozinka.";

      return;
    }


    closeLogin();


    $("adminModal")
      .classList.add("show");


    renderAdmin();


  } catch (error) {

    console.error(error);

    $("loginError")
      .textContent =
        "Greška pri prijavljivanju.";

  }

}


async function logoutAdmin() {

  try {

    await fetch(
      "/api/admin/logout",
      {
        method: "POST"
      }
    );

  } catch (error) {

    console.error(error);

  }

  closeAdminPanel();

}

<b>
${products.length}
</b>

<span>
proizvoda
</span>

<b>
${products.reduce(

    s +
    Number(p.stock || 0),

komada

          ||

  )}"

>

<div>

<b>
${esc(p.name)}
</b>

<small>

${money(p.price)}
·
${esc(
  p.brand ||

·
${esc(p.category)}

${Number(p.stock || 0)} kom.
·
pozicija

slika

</small>

<div class="admin-buttons">

    )

>
↑

>

<p class="muted">

/* =========================
   PRODUCT EDITOR
========================= */

function newProduct() {

  editId = null;

  editorImages = [];

  pendingFiles = [];


  $("editor").hidden = false;


  $("editorTitle").textContent =
    "NOVI PROIZVOD";


  [
    "pName",
    "pPrice",
    "pBrand",
    "pBadge",
    "pSizes",
    "pDesc"
  ].forEach(
    id =>
      $(id).value = ""
  );


  $("pCat").value =
    "patike";


  $("pStatus").value =
    "available";


  $("pStock").value =
    0;


  $("pOrder").value =
    products.length + 1;


  $("pImageFile").value =
    "";


  $("imagePreviewNote")
    .textContent =
      "";


  renderImageManager();

}


function editProduct(id) {

  const productId =
    Number(id);


  if (
    !Number.isInteger(productId) ||
    productId <= 0
  ) {

    alert(
      "Nedostaje ispravan ID."
    );

    return;
  }


  const p =
    products.find(
      x =>
        Number(x.id) ===
        productId
    );


  if (!p) {

    alert(
      "Proizvod nije pronađen."
    );

    return;
  }


  editId =
    productId;


  editorImages =
    [...getImages(p)];


  pendingFiles = [];


  $("editor").hidden = false;


  $("editorTitle").textContent =
    "UREDI PROIZVOD";


  $("pName").value =
    p.name || "";


  $("pPrice").value =
    p.price || "";


  $("pCat").value =
    p.category ||
    "patike";


  $("pBrand").value =
    p.brand || "";


  $("pStatus").value =
    Number(p.stock) > 0
      ? "available"
      : "sold";


  $("pStock").value =
    Number(p.stock || 0);


  $("pDesc").value =
    p.description || "";


  $("pOrder").value =
    Number(
      p.sortOrder || 1
    );


  $("pSizes").value =
    (p.sizes || [])
      .join(",");


  $("pBadge").value =
    p.badge || "";


  $("pImageFile").value =
    "";


  $("imagePreviewNote")
    .textContent =
      "";


  renderImageManager();

}


function hideEditor() {

  $("editor").hidden =
    true;

  editorImages = [];

  pendingFiles = [];

}


/* =========================
   DELETE PRODUCT
   OVO JE JEDINA DELETE FUNKCIJA
========================= */

async function deleteProduct(id) {

  const productId =
    Number(id);


  if (
    !Number.isInteger(productId) ||
    productId <= 0
  ) {

    alert(
      "Nedostaje ispravan ID."
    );

    return;
  }


  const product =
    products.find(
      p =>
        Number(p.id) ===
        productId
    );


  if (!product) {

    alert(
      "Proizvod nije pronađen."
    );

    return;
  }


  if (
    !confirm(
      `Da li želiš da obrišeš proizvod "${product.name}"?`
    )
  ) {

    return;
  }


  try {

    /*

/* =========================
   IMAGE FILES
========================= */

$("pImageFile")
  .addEventListener(
    "change",
    e => {

      pendingFiles = [];


      const files =
        [...e.target.files];


      if (!files.length) {

        $("imagePreviewNote")
          .textContent =
            "";

        return;
      }


      let loaded = 0;


      files.forEach(
        file => {

          const reader =
            new FileReader();


          reader.onload = () => {

            pendingFiles.push({

              file,

              data:
                String(
                  reader.result
                )
                .split(",")[1]

            });


            loaded++;


            $("imagePreviewNote")
              .textContent =
                `${loaded} novih slika spremno.`;

          };


          reader.onerror = () => {

            console.error(
              "Greška pri čitanju slike",
              file.name
            );

          };


          reader.readAsDataURL(
            file
          );

        }
      );

    }
  );


function renderImageManager() {

  $("imagePreview").innerHTML =
    editorImages
      .map(
        (src,i) => `

<div class="managed-image">

<img
  src="${esc(src)}"
  alt=""
>

<div>

<b>
Slika ${i + 1}
${i === 0
  ? " · GLAVNA"
  : ""}
</b>

<button
  type="button"
  onclick="
    imageUp(${i})
  "
>
↑
</button>

<button
  type="button"
  onclick="
    imageDown(${i})
  "
>
↓
</button>

<button
  type="button"
  onclick="
    setMainImage(${i})
  "
>
★
</button>

<button
  type="button"
  class="danger"
  onclick="
    removeImage(${i})
  "
>
×
</button>

</div>

</div>

`
      )
      .join("");

}


function imageUp(i) {

  if (i <= 0) return;


  [
    editorImages[i - 1],
    editorImages[i]
  ] =
  [
    editorImages[i],
    editorImages[i - 1]
  ];


  renderImageManager();

}


function imageDown(i) {

  if (
    i >=
    editorImages.length - 1
  ) {

    return;
  }


  [
    editorImages[i],
    editorImages[i + 1]
  ] =
  [
    editorImages[i + 1],
    editorImages[i]
  ];


  renderImageManager();

}


function setMainImage(i) {

  if (
    i < 0 ||
    i >= editorImages.length
  ) {

    return;
  }


  const image =
    editorImages.splice(
      i,
      1
    )[0];


  editorImages.unshift(
    image
  );


  renderImageManager();

}


function removeImage(i) {

  if (
    i < 0 ||
    i >= editorImages.length
  ) {

    return;
  }


  editorImages.splice(
    i,
    1
  );


  renderImageManager();

}


/* =========================
   ADMIN API
========================= */

async function adminRequest(
  url,
  options = {}
) {

  const response =
    await fetch(
      url,
      {
        credentials:
          "same-origin",
        ...options
      }
    );


  let data = null;


  try {

    data =
      await response.json();

  } catch {

    data = null;

  }


  if (!response.ok) {

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );

  }


  return data;

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

  const name =
    $("pName")
      .value
      .trim();


  const price =
    Number(
      $("pPrice").value
    );


  const category =
    $("pCat").value;


  const brand =
    $("pBrand")
      .value
      .trim();


  const stock =
    Math.max(
      0,
      Number(
        $("pStock").value
      ) || 0
    );


  const sortOrder =
    Math.max(
      1,
      Number(
        $("pOrder").value
      ) || 1
    );


  const description =
    $("pDesc")
      .value
      .trim();


  const badge =
    $("pBadge")
      .value
      .trim();


  const sizes =
    $("pSizes")
      .value
      .split(",")
      .map(
        x => x.trim()
      )
      .filter(Boolean);


  if (!name) {

    alert(
      "Unesi naziv proizvoda."
    );

    return;
  }


  if (
    !price ||
    price <= 0
  ) {

    alert(
      "Unesi ispravnu cenu."
    );

    return;
  }


  /*
    Kod novog proizvoda mora
    postojati bar jedna slika.
  */

  if (
    !editorImages.length &&
    !pendingFiles.length
  ) {

    alert(
      "Dodaj najmanje jednu sliku proizvoda."
    );

    return;
  }


  const button =
    document.querySelector(
      "#editor .form-actions .primary"
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "ČUVANJE...";

  }


  try {

    const uploadedImages =
      [];


    for (
      const item of pendingFiles
    ) {

      uploadedImages.push({

        name:
          item.file.name,

        type:
          item.file.type,

        data:
          item.data

      });

    }


    /*
      Za postojeći proizvod
      šaljemo ID u URL.

      Za novi proizvod
      koristimo /api/products.
    */

    const apiUrl =
      editId
        ? `/api/products/${encodeURIComponent(editId)}`
        : "/api/products";


    /*
      Ako uređujemo postojeći proizvod,
      postojeće slike ostaju.

      Nove slike idu u newImages.
    */

    const payload = {

      name,

      price,

      category,

      brand,

      stock,

      sortOrder,

      description,

      badge,

      sizes,

      images:
        editorImages,

      newImages:
        uploadedImages

    };


    const result =
      await adminRequest(
        apiUrl,
        {

          method:
            editId
              ? "PUT"
              : "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    /*
      Najsigurnije:
      nakon čuvanja ponovo učitamo
      proizvode sa servera.
    */

    await loadProducts();


    hideEditor();


    alert(
      "Proizvod je uspešno sačuvan."
    );


  } catch (error) {

    console.error(
      "SAVE PRODUCT ERROR:",
      error
    );


    alert(
      "Greška pri čuvanju proizvoda: " +
      (
        error?.message ||
        "Pokušaj ponovo."
      )
    );


  } finally {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "SAČUVAJ PROIZVOD";

    }

  }

}


/* =========================
   MOVE PRODUCT
========================= */

async function moveProduct(
  id,
  direction
) {

  const productId =
    Number(id);


  if (
    !Number.isInteger(productId) ||
    productId <= 0
  ) {

    alert(
      "Nedostaje ispravan ID."
    );

    return;
  }


  const list =
    [...products]
      .sort(
        (a,b) =>
          (
            Number(
              a.sortOrder || 0
            ) -
            Number(
              b.sortOrder || 0
            )
          )
          ||
          (
            Number(a.id) -
            Number(b.id)
          )
      );


  const index =
    list.findIndex(
      p =>
        Number(p.id) ===
        productId
    );


  if (index < 0) return;


  const newIndex =
    index + direction;


  if (
    newIndex < 0 ||
    newIndex >= list.length
  ) {

    return;
  }


  const current =
    list[index];


  const target =
    list[newIndex];


  const currentOrder =
    Number(
      current.sortOrder ||
      index + 1
    );


  const targetOrder =
    Number(
      target.sortOrder ||
      newIndex + 1
    );


  try {

    /*
      Backend očekuje PUT na:
      /api/products/:id

      Ne na /api/products sa id
      u body-ju.
    */


    await adminRequest(
      `/api/products/${encodeURIComponent(Number(current.id))}`,
      {

        method: "PUT",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            name:
              current.name,

            price:
              Number(current.price),

            category:
              current.category,

            brand:
              current.brand || "",

            stock:
              Number(
                current.stock || 0
              ),

            sortOrder:
              targetOrder,

            description:
              current.description || "",

            badge:
              current.badge || "",

            sizes:
              Array.isArray(
                current.sizes
              )
                ? current.sizes
                : [],

            images:
              getImages(current)

          })

      }
    );


    await adminRequest(
      `/api/products/${encodeURIComponent(Number(target.id))}`,
      {

        method: "PUT",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            name:
              target.name,

            price:
              Number(target.price),

            category:
              target.category,

            brand:
              target.brand || "",

            stock:
              Number(
                target.stock || 0
              ),

            sortOrder:
              currentOrder,

            description:
              target.description || "",

            badge:
              target.badge || "",

            sizes:
              Array.isArray(
                target.sizes
              )
                ? target.sizes
                : [],

            images:
              getImages(target)

          })

      }
    );


    await loadProducts();


  } catch (error) {

    console.error(
      "MOVE ERROR:",
      error
    );


    alert(
      "Greška pri promeni pozicije: " +
      (
        error?.message ||
        "Pokušaj ponovo."
      )
    );

  }

}
